# =============================================================================
#  ros2_controllers.yaml
#  Controller configuration for the 7-DOF arm + gripper
#  Loaded by gz_ros2_control::GazeboSimROS2ControlPlugin at spawn time.
# =============================================================================

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz – Gazebo Harmonic max reliable rate

    # ── Broadcasters ──────────────────────────────────────────────────────────
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # ── Arm controller ────────────────────────────────────────────────────────
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # ── Gripper controller ────────────────────────────────────────────────────
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ── arm_controller parameters ─────────────────────────────────────────────────
arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0       # Hz
    action_monitor_rate: 20.0       # Hz

    allow_partial_joints_goal: false
    open_loop_control: false

    # PID gains tuned for a ~10 kg arm
    gains:
      joint_1: { p: 200.0, i: 0.5, d: 20.0, i_clamp: 10.0 }
      joint_2: { p: 200.0, i: 0.5, d: 20.0, i_clamp: 10.0 }
      joint_3: { p: 150.0, i: 0.3, d: 15.0, i_clamp:  8.0 }
      joint_4: { p: 150.0, i: 0.3, d: 15.0, i_clamp:  8.0 }
      joint_5: { p:  80.0, i: 0.1, d:  8.0, i_clamp:  5.0 }
      joint_6: { p:  80.0, i: 0.1, d:  8.0, i_clamp:  5.0 }
      joint_7: { p:  50.0, i: 0.05, d: 5.0, i_clamp:  3.0 }

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0       # 0 = no global time limit
      joint_1: { trajectory: 0.05, goal: 0.01 }
      joint_2: { trajectory: 0.05, goal: 0.01 }
      joint_3: { trajectory: 0.05, goal: 0.01 }
      joint_4: { trajectory: 0.05, goal: 0.01 }
      joint_5: { trajectory: 0.05, goal: 0.01 }
      joint_6: { trajectory: 0.05, goal: 0.01 }
      joint_7: { trajectory: 0.05, goal: 0.01 }

# ── gripper_controller parameters ─────────────────────────────────────────────
gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_joint
      - gripper_right_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 10.0
    allow_partial_joints_goal: true
    open_loop_control: true

    gains:
      gripper_left_joint:  { p: 100.0, i: 0.0, d: 5.0, i_clamp: 5.0 }
      gripper_right_joint: { p: 100.0, i: 0.0, d: 5.0, i_clamp: 5.0 }

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0
